<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- FED-Indeed favicon — the ⌖ position-indicator glyph, cyan on dark -->
  <rect width="64" height="64" rx="14" fill="#07090f"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1.5"/>
  <!-- scan corner brackets -->
  <path d="M 14 22 V 14 H 22" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 42 14 H 50 V 22" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 50 42 V 50 H 42" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 22 50 H 14 V 42" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- crosshair dot -->
  <circle cx="32" cy="32" r="4.5" fill="#a78bfa"/>
  <circle cx="32" cy="32" r="9" fill="none" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.5"/>
</svg>
